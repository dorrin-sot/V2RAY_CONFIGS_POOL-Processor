name: Concatenate V2Ray Configs

on:
  workflow_dispatch:  # manual trigger
  repository_dispatch:  # triggered from foreign repo
    types: [v2ray-update]
  push:
    branches:
      - main
    paths:
      - .github/workflows/**

jobs:
  concat_and_commit:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Step 2: Checkout the foreign repository
      - name: Checkout foreign repo
        uses: actions/checkout@v4
        with:
          repository: V2RAYCONFIGSPOOL/V2RAY_SUB
          path: foreign-repo
          ref: main
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          submodules: false
          fetch-depth: 1

      # Step 3: Concatenate matching files
      - name: Concatenate v2ray_configs_*.txt
        run: |
          # Sort numerically to preserve order
          cat $(ls foreign-repo/v2ray_configs_*.txt | sort -V) | sort | uniq > concatenated_v2ray.txt
          rm -rf foreign-repo

      # Step 4: Split by country
      - name: Split by country
        run: |
          mkdir -p countries
      
          grep -oP '®️\K[^©️]+' concatenated_v2ray.txt | sort -u | while read country; do
            filename=$(echo "$country" | tr ' ' '_' | tr -d '()')
            grep "®️$country©️" concatenated_v2ray.txt > "countries/${filename}.txt"
          done

      # Step 5: Commit and push to your repo
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update concatenated V2Ray configs" || echo "No changes to commit"
          git remote set-url origin https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/dorrin-sot/V2RAY_CONFIGS_POOL-Processor.git
          git push origin main
